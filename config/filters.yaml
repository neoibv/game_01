# 하나라도 포함되면 이벤트 후보. 제외어가 있으면 점수를 깎는다.
include:
  - 이벤트
  - 증정
  - 추첨
  - 경품
  - 당첨
  - 선물
  - 기프티콘
  - 나눔
  - 드립니다
  - 드려요
  - giveaway
  - 응모양식
  - 응모 양식
  - 응모방법
  - 응모 방법
exclude:
  - 이벤트 종료
  - 당첨자 발표
  - 마감되었습니다

# true면 회원가입·상품 구매·앱 설치·통신사 가입 등이 필요한 유튜브 이벤트는 알리지 않는다.
# (채널 구독·좋아요·댓글·구글폼은 해당 없음) false면 ⚠️ 조건 표시와 함께 알린다.
exclude_signup_required: true

# 이 단어가 제목·설명·경품에 들어간 이벤트는 YouTube(전 채널·발견 검색 포함)와 사이트 이벤트 모두에서 제외한다.
# 소문자로 비교한다. 더 빼고 싶은 분야는 여기에 추가하면 된다(예: 마우스).
exclude_topics:
  - 키보드
  - keyboard
  - 키캡
  - 기계식
  - 타건
  - 텐키리스
  - 풀배열
  - 독거미
  - 바다축
  - 황축
  - 적축
  - 청축
  - 갈축
  - 저소음축
  - 리니어축
