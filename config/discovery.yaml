# 설정한 채널 밖의 IT 유튜버(구독자 적은 곳 포함)를 이벤트 키워드로 검색해 찾는다.
#
# 주의: YouTube 검색은 단어를 전부 포함한 영상만 돌려주므로(AND) 쿼리는 짧게(1~3단어) 써야 한다.
#       긴 쿼리는 결과가 0건이다. 쿼리당 API 100 unit(하루 한도 10,000)이라 max_queries_per_run × 100 unit이 매 실행 쓰인다.
enabled: true
max_queries_per_run: 10
lookback_days: 14         # 최근 N일 영상만 검색(이벤트 기간이 보통 1~2주)
category_id: ""           # 비움 = 전체 카테고리(소규모 리뷰어는 '과학·기술'로 분류되지 않는 경우가 많음). 28 = 과학·기술
allowed_categories: [it]  # 제목·설명 키워드와 AI 분류가 이 분야인 영상만 알림 (it / baby / gift_travel)
min_subscribers: 100      # 이보다 적으면 제외(스팸/개인 계정 방지)
max_subscribers: 0        # 0 = 상한 없음. 값을 주면 그 이상의 큰 채널은 제외
max_candidates: 40        # 한 번에 분석(AI)할 발견 영상 상한, 구독자 적은 채널 우선
max_watched: 60           # 이벤트를 연 적 있어 자동 감시하는 채널 수 상한
max_comment_fetches: 60   # 발견 영상 중 키워드 없는 영상의 고정댓글 확인 상한(쿼터 보호)
queries:
  - 구독자 이벤트 증정
  - 리뷰 증정 이벤트
  - 구독자 이벤트 이어폰
  - 구독자 이벤트 키보드
  - 구독자 이벤트 노트북
  - 구독자 이벤트 스마트폰
  - 댓글 이벤트 추첨
  - 경품 추첨 리뷰
  - 언박싱 이벤트 증정
  - 증정 이벤트 모니터
