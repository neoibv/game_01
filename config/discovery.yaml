# 설정한 채널 밖의 IT 유튜버(구독자 적은 곳 포함)를 이벤트 키워드로 검색해 찾는다.
# 검색은 쿼리당 YouTube API 100 unit(하루 한도 10,000)이라 max_queries_per_run × 100 unit이 매 실행 쓰인다.
enabled: true
max_queries_per_run: 8
lookback_days: 7          # 최근 N일 영상만 검색
category_id: "28"         # 28 = 과학·기술. 비우면 전체 카테고리
min_subscribers: 100      # 이보다 적으면 제외(스팸/개인 계정 방지)
max_subscribers: 0        # 0 = 상한 없음. 값을 주면 그 이상의 큰 채널은 제외
max_watched: 60           # 이벤트를 연 적 있어 자동 감시하는 채널 수 상한
max_comment_fetches: 60   # 발견 영상 중 키워드 없는 영상의 고정댓글 확인 상한(쿼터 보호)
queries:
  - 구독자 이벤트 증정 댓글 이어폰
  - 리뷰 후 증정 이벤트 키보드 마우스
  - 추첨 이벤트 선물 노트북 태블릿
  - 경품 이벤트 스마트폰 갤럭시 아이폰
  - 이벤트 증정 모니터 PC 부품
  - 구독자 감사 이벤트 헤드폰 스피커
  - 언박싱 후 선물 드립니다 댓글
  - 당첨 이벤트 가전 스마트워치
