name: sample-sites

# 수집기 개발용: 이벤트 사이트 목록 페이지를 받아 samples 브랜치에 저장한다(파서 픽스처).
on:
  workflow_dispatch:
  push:
    branches: [claude/confident-ptolemy-leaeu8]
    paths: [.github/workflows/sample-sites.yml]

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pages
        run: |
          mkdir out
          UA="Mozilla/5.0 (compatible; giveaway-hunter/0.1)"
          fetch() {
            name="$1"; url="$2"
            code=$(curl -sS -L -m 30 -A "$UA" -o "out/$name.html" -w "%{http_code}" "$url" || echo "ERR")
            echo "$name $code $url" | tee -a out/_status.txt
          }
          fetch quasarzone "https://quasarzone.com/bbs/qe_event"
          fetch quasarzone_robots "https://quasarzone.com/robots.txt"
          fetch danawa "https://event.danawa.com/"
          fetch danawa_robots "https://event.danawa.com/robots.txt"
          fetch jupjup "https://jupjup.app/"
          fetch jupjup_robots "https://jupjup.app/robots.txt"
          fetch suto "https://www.suto.co.kr/"
          fetch suto_robots "https://www.suto.co.kr/robots.txt"
          fetch eventskr "https://events.kr/"
          fetch eventskr_robots "https://events.kr/robots.txt"
          fetch ppomppu "https://www.ppomppu.co.kr/zboard/zboard.php?id=event"
          fetch ppomppu_robots "https://www.ppomppu.co.kr/robots.txt"
      - name: Publish to samples branch
        run: |
          cd out
          git init -q -b samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "samples $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" samples
        env:
          GH_TOKEN: ${{ github.token }}
