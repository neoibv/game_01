name: collect

on:
  schedule:
    # GitHub이 예약 실행을 누락하는 일이 있어 보조 시각을 둔다. 앞선 실행이 있었다면 아래에서 건너뛴다.
    - cron: "7 23 * * *"  # 08:07 KST
    - cron: "37 3 * * *"  # 12:37 KST
    - cron: "7 9 * * *"   # 18:07 KST
  workflow_dispatch:
    inputs:
      reset_events:
        description: "이전 알림 기록을 지우고 최근 30일을 새 형식으로 다시 받기"
        type: boolean
        default: false

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: scripts/state_restore.sh
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - run: giveaway collect ${{ inputs.reset_events && '--reset-events' || '' }} ${{ github.event_name == 'schedule' && '--skip-if-ran-within-hours 20' || '' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - if: always()
        run: scripts/state_save.sh
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
