name: collect

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Restore state
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state --depth=1
            git show FETCH_HEAD:giveaways.db.enc > data/giveaways.db.enc 2>/dev/null || true
          fi
          if [ -s data/giveaways.db.enc ]; then
            giveaway state decrypt data/giveaways.db.enc data/giveaways.db
          fi
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}

      - name: Collect
        run: giveaway collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        run: |
          giveaway state encrypt data/giveaways.db data/giveaways.db.enc
          d=$(mktemp -d)
          cp data/giveaways.db.enc "$d/"
          cd "$d"
          git init -q -b state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add giveaways.db.enc
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
